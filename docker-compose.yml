services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp:
    build:
      context: ./mcp-server
    ports:
      - "9111:9111"
    env_file: .env
    environment:
      MCP_HOST: "0.0.0.0"
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      MAILNET_SERVER_URL: http://mcp:9111/mcp
      SCHEDULE_HOST: "0.0.0.0"
    working_dir: /app/app
    command: ["python", "apscheduler_service.py"]
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      redis:
        condition: service_healthy
      mcp:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8002:8002"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      MAILNET_SERVER_URL: http://mcp:9111/mcp
      SCHEDULE_HOST: scheduler
    working_dir: /app/app
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8002"]
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      redis:
        condition: service_healthy
      mcp:
        condition: service_started
      scheduler:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      FASTAPI_URL: http://api:8002/agent
    depends_on:
      - api
    restart: unless-stopped
