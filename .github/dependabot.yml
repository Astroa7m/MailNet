# Weekly upgrade PRs. Minor and patch bumps are grouped into one PR per
# ecosystem so the list stays readable; major bumps arrive one by one because
# those are the ones that break things (and the tests job checks each PR).
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      api-minor:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: "/mcp-server"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      mcp-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      frontend-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
