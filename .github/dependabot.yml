# Monthly and quiet: one grouped PR per ecosystem carrying every minor and
# patch bump, and no major-version bumps at all. Majors are the ones that
# break things (zod 4, TypeScript 7, @ag-ui/client 1.0, cryptography 50), so
# they get upgraded by hand, deliberately, with a local test run. The security
# workflow still audits dependencies on every push and weekly, so a pinned
# version with a known CVE is still flagged.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      api-minor:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # FastAPI pins starlette (0.118 needs starlette below 0.49), so starlette
      # moves only together with a FastAPI upgrade, done by hand.
      - dependency-name: "starlette"

  - package-ecosystem: pip
    directory: "/mcp-server"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      mcp-minor:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      frontend-minor:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    groups:
      actions:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
