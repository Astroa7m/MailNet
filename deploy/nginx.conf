# MailNet production nginx configuration.
#
# This file is the authoritative copy of what runs at /etc/nginx/sites-available/mailnet
# on the server. It lived only on the box before, which is how a backend route
# (/tester-request) once shipped without a matching proxy rule and silently
# misrouted to the frontend in production.
#
# To apply:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/mailnet
#   sudo nginx -t && sudo systemctl reload nginx
#
# The certificate paths are the ones certbot created. If certbot renames the
# lineage (getmailnet.com-0001 and similar), update these two lines to match.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate-limit zones (security review F19), keyed on client IP. 10m holds roughly
# 160k addresses. auth guards login/callback/tester-request/upload; copilot
# guards the chat route. Both are generous, so a normal user never trips them.
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=copilot:10m rate=10r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name getmailnet.com;

    ssl_certificate     /etc/letsencrypt/live/getmailnet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getmailnet.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Uploads are capped at 20 MB in the application; give the proxy a little
    # headroom so oversized bodies are rejected by the app with a clear error.
    client_max_body_size 25m;
    server_tokens off;   # do not disclose the nginx version (F19)

    # Security headers. "always" so they are set on error responses too.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # OVERWRITE rather than append. The app trusts this header to rate limit by
    # client IP, so a value supplied by the caller must never survive.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # ---- API paths -> FastAPI on 8002 ----
    # Every backend route must appear here; anything missing falls through to
    # the frontend below and returns a Next.js 404 instead of reaching the API.
    location = /tz                { proxy_pass http://127.0.0.1:8002; }
    location = /me                { proxy_pass http://127.0.0.1:8002; }
    location = /logout            { proxy_pass http://127.0.0.1:8002; }
    location = /connection-status { proxy_pass http://127.0.0.1:8002; }
    location = /provider-models   { proxy_pass http://127.0.0.1:8002; }
    location = /upload-attachment { limit_req zone=auth burst=10 nodelay; proxy_pass http://127.0.0.1:8002; }
    location = /preferences       { proxy_pass http://127.0.0.1:8002; }
    location = /terms             { proxy_pass http://127.0.0.1:8002; }
    location = /privacy           { proxy_pass http://127.0.0.1:8002; }
    # Exact match: the /admin page itself is Next.js, only its data is the API.
    location = /admin/stats       { proxy_pass http://127.0.0.1:8002; }
    location /login           { limit_req zone=auth burst=10 nodelay; proxy_pass http://127.0.0.1:8002; }
    location /auth/           { limit_req zone=auth burst=10 nodelay; proxy_pass http://127.0.0.1:8002; }
    location /connect/        { proxy_pass http://127.0.0.1:8002; }
    location /api-keys        { proxy_pass http://127.0.0.1:8002; }
    location /memories        { proxy_pass http://127.0.0.1:8002; }
    location /threads         { proxy_pass http://127.0.0.1:8002; }
    location /attachment      { proxy_pass http://127.0.0.1:8002; }
    location /tester-request  { limit_req zone=auth burst=10 nodelay; proxy_pass http://127.0.0.1:8002; }
    location /schedules       { proxy_pass http://127.0.0.1:8002; }

    # ---- CopilotKit streaming (Next.js route handler) ----
    location /api/copilotkit {
        limit_req zone=copilot burst=30 nodelay;   # F19/F5
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- everything else -> Next.js ----
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

# Kept working for backward compatibility with anything still pointing at the
# api subdomain. The app itself only uses the apex domain.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.getmailnet.com;

    ssl_certificate     /etc/letsencrypt/live/getmailnet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getmailnet.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;
    server_tokens off;   # F19

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;                            # F19: parity with apex
    add_header Content-Security-Policy "frame-ancestors 'none'" always;  # F19

    # Close the interactive docs and schema here too (F17), in case the app is
    # ever started without ENVIRONMENT=production.
    location = /docs          { return 404; }
    location = /redoc         { return 404; }
    location = /openapi.json  { return 404; }
    location = /agent/health  { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

# Unknown Host headers get no application (security review F19). This is the
# default server for 443, so any request whose Host matches neither name above
# is dropped with 444 (nginx closes the connection). If `nginx -t` reports a
# duplicate default_server, another site already claims it: remove the other
# one or drop this block.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/getmailnet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getmailnet.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    return 444;
}

# Port 80 stays open: certbot renews over it, and visitors on http get bounced.
server {
    listen 80;
    listen [::]:80;
    server_name getmailnet.com api.getmailnet.com;
    return 301 https://$host$request_uri;
}
